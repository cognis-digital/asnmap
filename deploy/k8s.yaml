apiVersion: apps/v1
kind: Deployment
metadata: { name: asnmap, labels: { app: asnmap } }
spec:
  replicas: 1
  selector: { matchLabels: { app: asnmap } }
  template:
    metadata: { labels: { app: asnmap } }
    spec:
      containers:
        - name: asnmap
          image: ghcr.io/cognis-digital/asnmap:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: asnmap }
spec:
  selector: { app: asnmap }
  ports: [{ port: 80, targetPort: 8000 }]
